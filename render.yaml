services:
  # ---------------------------------------------------------------------------
  # CloudVault Web Application (Frontend - Free Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: cloudvault-app
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_AWS_REGION
        value: us-east-1
      - key: VITE_COGNITO_USER_POOL_ID
        sync: false
      - key: VITE_COGNITO_CLIENT_ID
        sync: false
      - key: VITE_API_ENDPOINT_URL
        sync: false
